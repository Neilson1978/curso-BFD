<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de salario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculadora de Salário</h1>
    <section>
        <div id="container" class="container">
           <input type="text" id="nome" placeholder="Nome">
           <input type="number" id="salario" placeholder="Salário Bruto">
           <input type="number" id="dependentes" placeholder="Número de Dependentes">
           <button id="btn-calcular">Calcular salario líquido</button>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
