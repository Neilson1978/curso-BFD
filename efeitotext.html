<!DOCTYPE html>
<html>
    <head>
       <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" type="text/css" href="style.css">
        <title>Efeito de texto</title>  
    </head>
    <style>
            .txt-destaque{
                display:flex;
            }
        .txt-destaque h1{
            color: #303721;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 3);
            transition: all 0.3s ease;
            font-size: 50px;
        }
        .txt-destaque h1:nth-child(odd):hover{
            transform: scale(2.0) translatey(-10px);
            color: blue;
        }
    </style>
    <body>
        <p>Passe o mouse no texto para ver o efeito</p>
    <div class="txt-destaque">
        <h1>T</h1>
        <h1>E</h1>
        <h1>S</h1>
        <h1>T</h1>
        <h1>E</h1>
    </div>
    </body>
</html>
